<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Exámenes - Primer Parcial</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-header-special {
            background: var(--buap-blue);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            margin-bottom: 30px;
        }
        .exam-section {
            margin-bottom: 50px;
        }
        .exam-section h2 {
            border-bottom: 3px solid var(--buap-blue);
            padding-bottom: 10px;
            color: var(--buap-blue);
            margin-bottom: 20px;
        }
        .student-result-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 6px solid var(--buap-light-blue);
        }
        .student-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .qa-item {
            margin-bottom: 15px;
            padding: 10px;
            background: #fdfdfd;
            border: 1px solid #f0f0f0;
            border-radius: 6px;
        }
        .qa-item strong {
            display: block;
            color: #555;
            margin-bottom: 5px;
        }
        .qa-item p {
            margin: 0;
            color: #000;
            white-space: pre-wrap;
            font-style: italic;
        }
        .incident-badge {
            background: #ffebee;
            color: #c62828;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .btn-print {
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
        }
        @media print {
            .btn-print, .nav-links { display: none; }
            .main-container { max-width: 100%; border: none; box-shadow: none; }
            .student-result-card { break-inside: avoid; border: 1px solid #ccc; }
        }
    </style>
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body style="background: #f8f9fa; padding: 0;">

    <div class="admin-header-special">
        <h1>🎓 Exámenes Primer Parcial</h1>
        <p>Panel de Resultados - Cultura Digital I y II</p>
    </div>

    <div class="main-container" style="max-width: 1000px; padding: 20px; background: transparent; box-shadow: none;">
        
        <div class="nav-links" style="margin-bottom: 20px; display: flex; justify-content: space-between;">
            <a href="index.html" style="text-decoration: none; color: var(--buap-blue); font-weight: 600;">← Ir al Inicio</a>
            <button onclick="window.print()" class="btn-print">🖨️ Imprimir Resultados</button>
        </div>

        <div id="results-content">
            <p style="text-align: center;">Cargando respuestas de los alumnos...</p>
        </div>

    </div>

    <script src="firebase-config.js"></script>
    <script>
        async function loadResults() {
            const container = document.getElementById('results-content');
            
            try {
                const snapshot = await db.collection('examenes_especiales')
                    .orderBy('timestamp', 'desc')
                    .get();
                
                if (snapshot.empty) {
                    container.innerHTML = '<p style="text-align: center;">Aún no hay exámenes realizados.</p>';
                    return;
                }

                // Group by Grade
                const groups = {
                    'cultura-digital-1': { title: '1° Año - Cultura Digital II', results: [] },
                    'cultura-digital-2': { title: '2° Año - Taller de Cultura Digital', results: [] }
                };

                snapshot.forEach(doc => {
                    const data = { id: doc.id, ...doc.data() };
                    if (groups[data.examen]) {
                        groups[data.examen].results.push(data);
                    }
                });

                let html = '';
                for (const key in groups) {
                    const group = groups[key];
                    if (group.results.length === 0) continue;

                    html += `<section class="exam-section">
                        <h2>${group.title}</h2>
                    `;

                    group.results.forEach(res => {
                        const hasIncidents = res.incidentes && res.incidentes.length > 0;
                        html += `
                            <div class="student-result-card">
                                <div class="student-meta">
                                    <div>
                                        <span style="font-size: 1.2rem; font-weight: 700; color: var(--buap-blue);">${res.alumno}</span>
                                        <span style="margin-left: 15px; color: #666;">📅 ${res.fecha} | 🕒 ${res.hora}</span>
                                    </div>
                                    ${hasIncidents ? `<span class="incident-badge">⚠️ ${res.incidentes.length} Incidentes</span>` : '<span style="color: var(--success); font-weight: 700;">✅ Sin incidentes</span>'}
                                    <button onclick="deleteResult('${res.id}')" style="background:none; border:none; color:#d32f2f; cursor:pointer; font-size:0.8rem; margin-left:10px; font-weight:bold;">🗑️ Borrar</button>
                                </div>
                                <div class="qa-container">
                                    ${res.respuestas.map((qa, i) => `
                                        <div class="qa-item">
                                            <strong>P${i+1}: ${qa.pregunta}</strong>
                                            <p>"${qa.respuesta}"</p>
                                        </div>
                                    `).join('')}
                                </div>
                                ${hasIncidents ? `
                                    <div style="margin-top: 15px; padding: 10px; background: #fff5f5; border-radius: 6px; font-size: 0.9rem;">
                                        <strong>🚩 Registro de Seguridad:</strong>
                                        <ul style="margin: 5px 0 0 20px; color: #c62828;">
                                            ${res.incidentes.map(log => `<li>${log}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                                <div style="margin-top: 10px; font-size: 0.85rem; color: #888; text-align: right;">
                                    Extensiones usadas: ${res.extensionesUsed || 0}
                                </div>
                            </div>
                        `;
                    });

                    html += `</section>`;
                }

                container.innerHTML = html || '<p style="text-align: center;">No hay resultados para mostrar.</p>';

            } catch (error) {
                console.error("Error loading results:", error);
                container.innerHTML = '<p style="text-align: center; color: red;">Error al cargar datos de Firebase.</p>';
            }
        }

        async function deleteResult(id) {
            if (confirm('¿Estás seguro de que deseas borrar permanentemente este intento de examen? El alumno podrá volver a realizarlo.')) {
                try {
                    await db.collection('examenes_especiales').doc(id).delete();
                    alert('Intento borrado exitosamente.');
                    loadResults(); // Reload
                } catch (error) {
                    console.error("Error deleting document:", error);
                    alert('Error al intentar borrar el registro.');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
